<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Doorzoek de collectie van de NBS-bibliotheek." />
    <title>NBS Bibliotheek — Collectie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="data/books.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main id="collectie" class="catalogue wrap">
      <!-- <div class="section-heading">
        <div>
          <h1>NBS-Bibliotheek</h1>
        </div>
        <p id="result-summary" class="result-summary" aria-live="polite">Collectie laden…</p>
      </div> -->

      <section class="search-panel" aria-label="Zoeken en filteren">
        <label class="search-box" for="search">
          <span class="search-icon" aria-hidden="true"></span>
          <span class="sr-only">Zoek in de collectie</span>
          <input id="search" type="search" placeholder="Zoek op titel, auteur, onderwerp…" autocomplete="off" />
          <kbd>/</kbd>
        </label>

        <div class="filters">
          <label>Onderwerp<select id="category"><option value="">Alle categorieën</option></select></label>
          <label>Taal<select id="language"><option value="">Alle talen</option></select></label>
          <label>Sorteren<select id="sort">
            <option value="title">Titel A–Z</option>
            <option value="author">Auteur A–Z</option>
            <option value="year-desc" selected>Jaar: nieuw–oud</option>
            <option value="year-asc">Jaar: oud–nieuw</option>
          </select></label>
          <button id="clear-filters" class="clear-button" type="button">Wis filters</button>
        </div>
      </section>

      <div id="active-filters" class="active-filters" aria-label="Actieve filters"></div>
      <section id="results" class="results" aria-label="Zoekresultaten"></section>

      <div id="empty-state" class="empty-state" hidden>
        <span aria-hidden="true">∅</span>
        <h3>Geen werken gevonden</h3>
        <p>Probeer een andere zoekterm of verwijder een filter.</p>
        <button type="button" class="button" data-clear>Wis alle filters</button>
      </div>

      <nav id="pagination" class="pagination" aria-label="Paginering"></nav>
    </main>

    <dialog id="book-dialog" aria-labelledby="dialog-title">
      <button class="dialog-close" type="button" aria-label="Sluiten">×</button>
      <div id="dialog-content"></div>
    </dialog>

    <template id="book-template">
      <article class="book-card">
        <div class="spine" aria-hidden="true"></div>
        <div class="book-main">
          <div class="book-meta"><span class="category-pill"></span><span class="language"></span></div>
          <h3></h3>
          <p class="author"></p>
        </div>
        <div class="book-aside">
          <span class="year"></span>
          <button type="button" class="detail-button">Details <span aria-hidden="true">↗</span></button>
        </div>
      </article>
    </template>
  </body>
</html>
